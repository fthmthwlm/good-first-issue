<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>good-first-issue</title>
    <meta
      name="description"
      content="Discover beginner-friendly open-source projects and contribute to the community! Start your journey in open source development with good-first-issue."
    />
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>

    <header>

      <div class="nav-menu">

            <a href="https://github.com/fthmthwlm" class="github-link">to github</a>
            <button class="btn-theme">change theme</button>
      </div>
    </header>

    <!-- section greet thhe user and take the user name -->
    <section class="section1">

        <!-- the initial message -->
          <p class="message">
            hello welcome to our website, <br> please tell us your name
          </p>

          <!-- input to take the name -->
            <form action="">
              <label class="nameLabel">
                your name:
                <input type="text" class="nameInput" id="nameValue"
                placeholder="yohaness nyalusi">
              </label>
                <button id="submit" type="submit" class="btn-theme">submit</button>
            </form>

    </section>

    <!-- <!-section to display the modal-   -->
    <section class="section2">

      <!-- the modal -->
        <div id="themodal" class="modal hidden">

          <h1>
            hello <span id="displayValue"></span>, <br>
            welcome to contribute to good first issue.
          </h1>

        </div>

    </section>



    <script src="./index.js" type="module"></script>
  </body>
</html>
