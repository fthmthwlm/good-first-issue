<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Meta Information -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page Title -->
    <title>Good First Issue</title>

    <!-- SEO Meta Description -->
    <meta
      name="description"
      content="Discover beginner-friendly open-source projects and start contributing to the open-source community with Good First Issue."
    />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="index.css" />

    <!-- Scripts -->
    <script src="./darkmode.js" type="module" defer></script>
    <script src="./index.js" type="module" defer></script>
  </head>

  <body class="bg-white dark:bg-gray-900 transition-colors duration-300">
    <!-- Header -->
    <header>
      <!-- Navbar -->
      <nav
        class="bg-white border-b border-gray-200 dark:bg-gray-900 dark:border-gray-700 shadow-sm"
      >
        <div
          class="max-w-screen-xl mx-auto flex items-center justify-between p-4"
        >
          <!-- Logo / Brand -->
          <a
            href="https://github.com/fthmthwlm"
            target="_blank"
            rel="noopener noreferrer"
            class="flex items-center space-x-2"
          >
            <span
              class="text-2xl font-bold text-gray-900 dark:text-white"
            >
              fthmthwlm
            </span>
          </a>

          <!-- Theme Toggle Button -->
          <button
            id="theme-toggle"
            type="button"
            aria-label="Toggle Dark Mode"
            class="flex items-center justify-center rounded-lg p-2.5 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 transition"
          >
            <!-- Moon Icon -->
            <svg
              id="theme-toggle-dark-icon"
              class="hidden w-5 h-5 text-gray-800 dark:text-gray-200"
              fill="currentColor"
              viewBox="0 0 20 20"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
              />
            </svg>

            <!-- Sun Icon -->
            <svg
              id="theme-toggle-light-icon"
              class="hidden w-5 h-5 text-yellow-400"
              fill="currentColor"
              viewBox="0 0 20 20"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
              />
            </svg>
          </button>
        </div>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="max-w-screen-xl mx-auto px-4 py-8">
      <!-- Hero Section -->
      <section class="text-center mb-10">
        <h1
          class="text-4xl font-extrabold text-gray-900 dark:text-white mb-4"
        >
          Good First Issue
        </h1>

        <p
          class="text-lg text-gray-600 dark:text-gray-300 max-w-2xl mx-auto"
        >
          Discover beginner-friendly open-source projects and start your journey
          into open-source contribution.
        </p>
      </section>

      <!-- Projects Section -->
      <section
        id="index"
        class="flex flex-wrap justify-center gap-6"
      >
        <!-- Dynamic Project Cards Will Render Here -->
      </section>
    </main>

    <!-- Footer -->
    <footer
      class="border-t border-gray-200 dark:border-gray-700 py-6 mt-10"
    >
      <div class="max-w-screen-xl mx-auto text-center">
        <p class="text-sm text-gray-500 dark:text-gray-400">
          © 2026 Good First Issue. Built for open-source contributors.
        </p>
      </div>
    </footer>
  </body>
</html>
